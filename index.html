<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#03070c">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ยินดีต้อนรับ แอดมิน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{--bg:#03070c;--panel:linear-gradient(180deg,#f3f3f2 0%,#dadbdc 100%);--line:rgba(60,70,80,.32);--tx:#e9eef4;--mut:#9fb0c0;--acc:#c58f00;--ok:#2f9e44;--bad:#d6334b;--g:linear-gradient(180deg,#ffe156 0%,#f2b705 100%)}
/* พื้นผิวสีเงินแบบเมนู SAO: ข้างในใช้ตัวอักษรเข้ม */
.login,.row,.form,.modal,.nav,.dd-btn,.dd-menu{--tx:#23272d;--mut:#666d75;--line:rgba(60,70,80,.32);color:var(--tx)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--tx);font-family:'Prompt',system-ui,sans-serif;font-size:15px;line-height:1.5;background:radial-gradient(circle at 80% 18%,rgba(30,95,140,.38),transparent 52%),radial-gradient(circle at 8% 78%,rgba(20,65,95,.42),transparent 52%),linear-gradient(180deg,#02060b 0%,#06101a 100%);background-attachment:fixed}
button,input,select{font:inherit;color:#23272d}
input,select{background:#f7f7f6;border:1px solid #b4b8bd;border-radius:12px;padding:9px 12px;width:100%;min-width:0}
input::placeholder{color:#8a9097}
select option{background:#f4f4f3;color:#23272d}
input:focus,select:focus{outline:2px solid var(--acc);outline-offset:-1px}
button{cursor:pointer;border:1px solid #a9adb2;background:linear-gradient(180deg,#f7f7f6,#dedfe0);border-radius:999px;padding:9px 18px}
button:hover{border-color:var(--acc)}
button.pri,.nav button.on{background:var(--g);color:#1f1b00;border-color:transparent;font-weight:600;box-shadow:0 4px 18px rgba(255,200,0,.35)}
button.dan{color:var(--bad)}
button:disabled{opacity:.5;cursor:default}
.wrap{max-width:480px;margin:0 auto;padding:16px 14px calc(24px + env(safe-area-inset-bottom,0px))}
.login,.row,.form,.modal{background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:0 8px 26px rgba(0,0,0,.5)}
.login{max-width:360px;margin:15vh auto 0;padding:24px}
.login h1{margin:0 0 14px;font-size:20px}
.login .gap{margin-top:10px}
.top{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.top h1{font-size:18px;margin:0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;gap:8px;flex:none}
.ibtn{width:40px;height:40px;padding:0;display:grid;place-items:center;border-radius:12px}
.ibtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav{--i:0;position:relative;display:flex;gap:4px;padding:4px;margin-bottom:14px;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 6px 20px rgba(0,0,0,.45);-webkit-tap-highlight-color:transparent}
.nav::before{content:"";position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 16px)/3);border-radius:12px;background:var(--g);box-shadow:0 3px 14px rgba(255,190,0,.55);transform:translateX(calc(var(--i)*(100% + 4px)));transition:transform .38s cubic-bezier(.34,1.45,.5,1)}
.nav button,.nav button.on{position:relative;z-index:1;flex:1;min-width:0;padding:9px 4px;font-size:14px;white-space:nowrap;border:0;border-radius:12px;background:transparent;box-shadow:none;color:var(--mut);font-weight:500;transition:color .25s,transform .15s}
.nav button.on{color:#1f1b00;font-weight:700}
.nav button:active{transform:scale(.93)}
@keyframes vin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.vin{animation:vin .3s ease both}
.filters{display:flex;gap:8px;margin-bottom:12px;align-items:stretch}
.filters input{flex:1;min-width:0}
.dd{position:relative;flex:0 0 42%;min-width:0}
.dd-btn{width:100%;height:100%;display:flex;align-items:center;justify-content:space-between;gap:6px;text-align:left;padding:9px 12px;border-radius:12px;border-color:#9aa0a6;background:linear-gradient(180deg,#f7f7f6,#e1e2e3);transition:border-color .2s,box-shadow .2s}
.dd-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-btn svg{flex:none;width:16px;height:16px;stroke:var(--mut);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s}
.dd.open .dd-btn{border-color:#f0b800;box-shadow:0 0 14px rgba(255,200,0,.45)}
.dd.open .dd-btn svg{transform:rotate(180deg);stroke:#23272d}
.dd-menu{position:absolute;z-index:20;left:0;top:calc(100% + 8px);min-width:100%;width:max-content;max-width:78vw;padding:6px;border-radius:16px;background:#f1f1f0;border:1px solid #aeb2b7;box-shadow:0 14px 34px rgba(0,0,0,.55);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);visibility:hidden;opacity:0;transform:translateY(-6px) scale(.97);transform-origin:top left;pointer-events:none;transition:opacity .18s,transform .18s,visibility 0s .18s}
.dd.open .dd-menu{visibility:visible;opacity:1;transform:none;pointer-events:auto;transition:opacity .18s,transform .18s}
.dd.sel{display:block;flex:none;width:100%;margin-top:2px}
.dd.sel .dd-btn{height:auto;border-color:#b4b8bd;background:#f7f7f6}
.dd-menu.fx{position:fixed;z-index:200;left:0;top:0;width:max-content;max-width:calc(100vw - 16px);overflow-y:auto;overscroll-behavior:contain;transition:opacity .18s,transform .18s,visibility 0s .18s}
.dd-menu.fx.open{visibility:visible;opacity:1;transform:none;pointer-events:auto;transition:opacity .18s,transform .18s}
.dd-menu button{display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;text-align:left;padding:10px 12px;border:0;border-radius:11px;background:transparent;font-size:14px;color:var(--tx)}
.dd-menu button:active{background:rgba(0,0,0,.08)}
.dd-menu button i{width:8px;height:8px;border-radius:50%;background:transparent;flex:none}
.dd-menu button.on{background:linear-gradient(180deg,#ffe36a,#f2b705);color:#1f1b00;font-weight:700}
.dd-menu button.on i{background:#1f1b00;box-shadow:none}
.row{padding:14px;margin-bottom:12px}
.rh{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:8px}
.rh b{color:var(--acc);font-size:18px}
.rh small{color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.grid label,.form label{display:block;font-size:12px;color:var(--mut)}
.grid input,.grid select{margin-top:2px}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.form{padding:16px}
.form .grid{margin-bottom:12px}
.form input,.form select{margin-top:2px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl td,.tbl th{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{color:var(--mut);font-weight:500}
.tag{padding:2px 10px;border-radius:999px;font-size:12px;border:1px solid var(--line)}
.tag.ok{color:var(--ok);border-color:var(--ok)}
.tag.bad{color:var(--bad);border-color:var(--bad)}
.tag.wait{color:var(--acc);border-color:var(--acc)}
.mut{color:var(--mut)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));width:max-content;transform:translateX(-50%);background:#0e1620;color:#fff;border:1px solid #f6c915;padding:10px 20px;border-radius:999px;z-index:99;max-width:90vw;box-shadow:0 6px 22px rgba(0,0,0,.55)}
.ov{position:fixed;inset:0;background:rgba(2,6,12,.86);z-index:50;overflow:auto;padding:16px}
.modal{max-width:480px;margin:0 auto;padding:16px;background:var(--panel)}
.modal h2{margin:0 0 12px;font-size:17px}
.pv{width:100%;overflow:hidden;border-radius:20px;margin-bottom:14px}
.pvi{transform-origin:top left}
[hidden]{display:none!important}
#intro{position:fixed;inset:0;z-index:300;background:#000;overflow:hidden;opacity:0;transition:opacity .25s;touch-action:none}
#intro.on{opacity:1}
#intro.out{opacity:0;transition:opacity .6s ease}
#introC{position:absolute;inset:0;width:100%;height:100%}
.intro-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.intro-flash.go{animation:iflash .7s ease-out forwards}
@keyframes iflash{0%{opacity:0}18%{opacity:1}100%{opacity:0}}
.intro-txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;opacity:0;pointer-events:none;text-align:center;padding:0 16px}
.intro-txt b{font-size:clamp(30px,10vw,56px);font-weight:800;letter-spacing:.1em;white-space:nowrap;background:linear-gradient(90deg,#6fe7ff,#a78bff,#ff8ad4,#ffd36f,#6fe7ff);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px rgba(140,200,255,.85));animation:ishine 1.6s linear infinite}
.intro-txt span{font-size:14px;letter-spacing:.22em;color:#d6e9ff;text-shadow:0 0 10px rgba(120,190,255,.9)}
.intro-txt.show{animation:itxt 1.45s ease both}
@keyframes itxt{0%{opacity:0;transform:scale(1.5)}22%{opacity:1;transform:scale(1)}85%{opacity:1;transform:scale(1.02)}100%{opacity:0;transform:scale(1.06)}}
@keyframes ishine{to{background-position:200% 0}}
/* ธีมสี SAO: ฟ้าน้ำแข็ง/ขาว + ส้มเป็นจุดเน้น */
#intro[data-theme=sao]{background:radial-gradient(circle at 50% 50%,#08304f 0%,#02101f 55%,#000 100%)}
#intro[data-theme=sao] .intro-flash{background:#eafaff}
#intro[data-theme=sao] .intro-txt b{font-weight:700;letter-spacing:.16em;background:linear-gradient(90deg,#ffffff,#9fe8ff,#4fc3f7,#ffffff,#9fe8ff);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 12px rgba(90,200,255,.95)) drop-shadow(0 0 28px rgba(60,150,255,.6))}
#intro[data-theme=sao] .intro-txt span{color:#cdefff;text-shadow:0 0 10px rgba(90,200,255,.9);padding-top:10px;border-top:1px solid rgba(255,160,50,.95);box-shadow:0 -1px 10px rgba(255,150,40,.45)}

/* ===== การ์ด (ขนาดจริง 800x520 ใช้เป็นรูปตอนบันทึก) — สีมาจากธีม .t-xxx ===== */
.card.t-night{--bg:linear-gradient(135deg,#1c2060 0%,#0d1033 52%,#35145f 100%);--tx:#f4f5ff;--mut:rgba(222,224,255,.64);--acc:#d9cbff;--glow:rgba(150,120,255,.8);--pill-bg:rgba(255,255,255,.10);--pill-bd:rgba(255,255,255,.38);--pill-tx:#e9e0ff;--seal:radial-gradient(circle at 30% 28%,#9aa6ff 0%,#c77dff 52%,#5b2fb0 100%);--seal-bd:rgba(255,255,255,.5);--dot:#ffffff;--line:rgba(255,255,255,.16);--ring:rgba(255,255,255,.07);--sheen:linear-gradient(115deg,rgba(255,255,255,0) 22%,rgba(255,255,255,.11) 40%,rgba(255,255,255,0) 56%);--bar-bg:rgba(255,255,255,.14);--bar-fill:linear-gradient(90deg,#7f8fff,#ff85c0);--chip-bg:rgba(255,255,255,.08);--chip-bd:rgba(255,255,255,.26);--dig1:#5b8cff;--dig2:#ff5fa8}
.card.t-graphite{--bg:linear-gradient(135deg,#505667 0%,#272b35 36%,#171a21 56%,#414756 100%);--tx:#f1f3f8;--mut:rgba(226,230,241,.62);--acc:#eef1f8;--glow:rgba(255,255,255,.35);--pill-bg:rgba(255,255,255,.08);--pill-bd:rgba(232,236,246,.5);--pill-tx:#eef1f8;--seal:radial-gradient(circle at 30% 28%,#ffffff 0%,#cfd5e0 52%,#7e8798 100%);--seal-bd:rgba(30,34,44,.35);--dot:#2a2e38;--line:rgba(255,255,255,.15);--ring:rgba(255,255,255,.06);--sheen:linear-gradient(115deg,rgba(255,255,255,0) 22%,rgba(255,255,255,.16) 40%,rgba(255,255,255,0) 56%);--bar-bg:rgba(255,255,255,.14);--bar-fill:linear-gradient(90deg,#aab2c3,#f6f8fc);--chip-bg:rgba(255,255,255,.08);--chip-bd:rgba(255,255,255,.28);--dig1:#8fb0ff;--dig2:#ff8fc0}
.card.t-pearl{--bg:linear-gradient(135deg,#f8f9fc 0%,#d3d8e1 28%,#f1f3f7 48%,#b8bfcc 72%,#e8ebf0 100%);--tx:#1d2233;--mut:rgba(29,34,51,.58);--acc:#3a2f9e;--glow:rgba(0,0,0,0);--pill-bg:rgba(75,63,168,.10);--pill-bd:rgba(75,63,168,.38);--pill-tx:#4338a8;--seal:radial-gradient(circle at 30% 28%,#ffffff 0%,#d5dae3 50%,#8f98aa 100%);--seal-bd:rgba(40,48,70,.28);--dot:#2f2a7a;--line:rgba(29,34,51,.16);--ring:rgba(40,48,70,.09);--sheen:linear-gradient(115deg,rgba(255,255,255,0) 22%,rgba(255,255,255,.7) 40%,rgba(255,255,255,0) 56%);--bar-bg:rgba(29,34,51,.14);--bar-fill:linear-gradient(90deg,#7a70e0,#3a2f9e);--chip-bg:rgba(255,255,255,.55);--chip-bd:rgba(29,34,51,.22);--dig1:#4b6bd6;--dig2:#c2478a}
.card.t-ice{--bg:linear-gradient(135deg,#f3f8ff 0%,#c9d8f2 35%,#eaf1ff 55%,#a9bde3 100%);--tx:#14224d;--mut:rgba(20,34,77,.6);--acc:#2447d6;--glow:rgba(0,0,0,0);--pill-bg:rgba(36,71,214,.10);--pill-bd:rgba(36,71,214,.4);--pill-tx:#2447d6;--seal:radial-gradient(circle at 30% 28%,#ffffff 0%,#cfdcf5 50%,#7f95c8 100%);--seal-bd:rgba(20,34,77,.28);--dot:#2447d6;--line:rgba(20,34,77,.16);--ring:rgba(20,34,77,.08);--sheen:linear-gradient(115deg,rgba(255,255,255,0) 22%,rgba(255,255,255,.75) 40%,rgba(255,255,255,0) 56%);--bar-bg:rgba(20,34,77,.14);--bar-fill:linear-gradient(90deg,#6f8cff,#2447d6);--chip-bg:rgba(255,255,255,.6);--chip-bd:rgba(20,34,77,.22);--dig1:#2447d6;--dig2:#d6479b}

.card{width:800px;height:520px;position:relative;overflow:hidden;border-radius:36px;background:var(--bg);color:var(--tx);font-family:'Prompt',sans-serif}
.card.daily{height:560px}
.card .sheen{position:absolute;left:0;top:0;right:0;bottom:0;background:var(--sheen)}
.card .ring{position:absolute;border:1px solid var(--ring);border-radius:50%}
.card .dig{position:absolute;font-family:monospace;font-size:16px;line-height:22px;font-weight:700;white-space:pre}
.card .dig.b{color:var(--dig1)}
.card .dig.p{color:var(--dig2)}
.card .brand{position:absolute;left:44px;top:34px;font-size:25px;font-weight:700;line-height:1.4;letter-spacing:.5px}
.card .pill{position:absolute;right:44px;top:32px;padding:6px 20px;border-radius:999px;background:var(--pill-bg);color:var(--pill-tx);font-size:20px;font-weight:600;border:1px solid var(--pill-bd);line-height:1.4}
.card .l1,.card .l2,.card .lb,.card .lbx,.card .dg-l,.card .dg-u{color:var(--mut)}
.card .l1{position:absolute;left:44px;top:100px;font-size:19px;line-height:1.4}
.card .l2{position:absolute;left:44px;top:256px;font-size:19px;line-height:1.4}
.card .code{position:absolute;left:40px;top:128px;font-size:104px;font-weight:800;line-height:1.1;color:var(--acc);letter-spacing:2px;text-shadow:0 0 24px var(--glow)}
.card .seal{position:absolute;right:52px;top:140px;width:128px;height:128px;border-radius:50%;background:var(--seal);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.28)}
.card .seal .in{width:104px;height:104px;border-radius:50%;border:2px solid var(--seal-bd);display:flex;align-items:center;justify-content:center}
.card .seal .dot{width:46px;height:46px;border-radius:50%;background:var(--dot)}
.card .name{position:absolute;left:44px;top:288px;width:712px;font-size:44px;font-weight:700;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .hr{position:absolute;left:44px;top:366px;width:712px;height:1px;background:var(--line)}
.card .stats{position:absolute;left:44px;top:382px;width:712px;display:grid;grid-template-columns:1.1fr 1fr 1.1fr;gap:20px}
.card .st .lb{font-size:19px;line-height:1.3}
.card .st .vl{font-size:42px;font-weight:700;line-height:1.3;white-space:nowrap}
.card .st .vl.sm{font-size:30px;padding-top:8px}
.card .foot{position:absolute;left:44px;right:44px;top:478px;display:flex;justify-content:space-between;font-size:17px;color:var(--mut);line-height:1.4}
.card .dcode{position:absolute;left:44px;top:122px;font-size:60px;font-weight:800;line-height:1.1;color:var(--acc);letter-spacing:1px;text-shadow:0 0 20px var(--glow)}
.card .dname{position:absolute;left:44px;top:192px;width:380px;font-size:34px;font-weight:700;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .dg-l{position:absolute;left:450px;top:96px;font-size:19px;line-height:1.4}
.card .dg{position:absolute;left:450px;top:124px;width:306px;font-weight:800;color:var(--acc);line-height:1.15;white-space:nowrap;text-shadow:0 0 24px var(--glow)}
.card .dg-u{position:absolute;left:450px;top:224px;font-size:20px;line-height:1.4}
.card .prow{position:absolute;left:44px;top:292px;width:712px;display:flex;justify-content:space-between;align-items:baseline}
.card .lbx{font-size:19px}
.card .pval{font-size:32px;font-weight:700;line-height:1.3}
.card .bar{position:absolute;left:44px;top:346px;width:712px;height:22px;border-radius:11px;background:var(--bar-bg)}
.card .bar i{display:block;height:22px;border-radius:11px;background:var(--bar-fill)}
.card .psub{position:absolute;left:44px;top:378px;width:712px;display:flex;justify-content:space-between;font-size:19px;color:var(--mut);line-height:1.4}
.card .chips2{position:absolute;left:44px;top:466px;width:712px;display:flex;gap:10px;overflow:hidden}
.card .chip{padding:5px 14px;border-radius:999px;border:1px solid var(--chip-bd);background:var(--chip-bg);font-size:18px;font-weight:600;white-space:nowrap;line-height:1.4}
.card .mutl{font-size:18px;color:var(--mut);line-height:1.8}


/* ===== การ์ดแนวบัตรประชาชน (id-xxx): แถบข้างแนวตั้ง + กรอบรูปตัวละคร + ช่องข้อมูล ===== */
.card.t-id-rose{--paper:#fbf6f2;--strip:linear-gradient(180deg,#a8334f 0%,#7a1f3a 55%,#4f1228 100%);--ink:#3b1a22;--lab:#c2763a;--acc:#b3304f;--frame:#8d3b30;--line:rgba(130,45,55,.22);--ringc:rgba(190,70,90,.12);--mut:rgba(59,26,34,.6);--bar-bg:rgba(130,45,55,.14);--bar-fill:linear-gradient(90deg,#e0708a,#a8334f);--chip-bg:rgba(179,48,79,.08);--chip-bd:rgba(179,48,79,.32)}
.card.t-id-sky{--paper:#f6f8fd;--strip:linear-gradient(180deg,#3447b5 0%,#222f86 55%,#121a52 100%);--ink:#16204d;--lab:#3d6bd6;--acc:#2f48c0;--frame:#2c3f9a;--line:rgba(30,45,130,.2);--ringc:rgba(70,100,220,.12);--mut:rgba(22,32,77,.6);--bar-bg:rgba(30,45,130,.14);--bar-fill:linear-gradient(90deg,#6f8cff,#ff85c0);--chip-bg:rgba(47,72,192,.08);--chip-bd:rgba(47,72,192,.3)}
.card.t-id-violet{--paper:#f9f6fd;--strip:linear-gradient(180deg,#7a4fd0 0%,#4e2a9c 55%,#28135f 100%);--ink:#2a1b4d;--lab:#b05fc8;--acc:#7a3fd0;--frame:#5b36ad;--line:rgba(90,50,170,.2);--ringc:rgba(150,90,230,.12);--mut:rgba(42,27,77,.6);--bar-bg:rgba(90,50,170,.14);--bar-fill:linear-gradient(90deg,#7f8fff,#ff85c0);--chip-bg:rgba(122,63,208,.08);--chip-bd:rgba(122,63,208,.3)}
.card.id{background:var(--paper);color:var(--ink)}
.card.id .i-ring{position:absolute;border:2px solid var(--ringc);border-radius:50%}
.card.id .i-strip{position:absolute;left:0;top:0;bottom:0;width:92px;background:var(--strip);box-shadow:inset -2px 0 0 rgba(255,255,255,.22)}
.card.id .i-vt,.card.id .i-no{position:absolute;left:62px;transform:rotate(90deg);transform-origin:0 0;color:#fff;white-space:nowrap;line-height:30px}
.card.id .i-vt{top:34px;width:380px;font-size:21px;font-weight:600;letter-spacing:5px}

<script>
// ====== ตั้งค่า (แก้ตรงนี้) ======
const CONFIG = {
  API: 'https://script.google.com/macros/s/AKfycbxMuph1X06qkWnyaN9KdcC02w_qPKDxzB2nisSoOhv59f6aS9EchQzmOnOokdrVC9KjVw/exec',
  SHOP: 'Junchen Studio',
  FOOT: 'เก็บเลขคิวนี้ไว้เช็คสถานะ',
  TABS: ['ฟาร์มเพชร', 'อ่านสตอรี่'],
  // รายการสถานะในช่องเลือก (แก้ให้ตรงกับที่ใช้ในชีตได้) ระบบจะรวมกับสถานะที่มีอยู่ในชีตให้อัตโนมัติ
  STATUSES: ['รอคิว', 'กำลังทำ', 'เสร็จแล้ว'],
  UNITS: { 'ฟาร์มเพชร': 'จำนวนเพชร', 'อ่านสตอรี่': 'จำนวนสตอรี่' },
  // การ์ดรายวัน: หน่วยสั้น และข้อความหัวยอดของวัน
  UNIT_SHORT: { 'ฟาร์มเพชร': 'เพชร', 'อ่านสตอรี่': 'สตอรี่' },
  DAILY_LABEL: { 'ฟาร์มเพชร': 'วันนี้ฟาร์มได้', 'อ่านสตอรี่': 'วันนี้อ่านได้' }
};

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => { const x = Number(n); return isFinite(x) ? x.toLocaleString('en-US') : esc(n); };

const THEMES = [['id-rose', 'แนวบัตร · แดงเข้ม-ครีม'], ['id-sky', 'แนวบัตร · น้ำเงิน-ครีม'], ['id-violet', 'แนวบัตร · ม่วง-ครีม'], ['night', 'ม่วงกลางคืน (เข้ากับเว็บ)'], ['graphite', 'แพลทตินัมเข้ม'], ['pearl', 'แพลทตินัมอ่อน'], ['ice', 'ฟ้าน้ำแข็ง']];
let THEME = 'id-rose';
try { const t = localStorage.getItem('cardTheme2'); if (THEMES.some(x => x[0] === t)) THEME = t; } catch (e) {}

// เลขไบนารีบนการ์ด (สุ่มจากรหัสคิว ได้ลายเดิมทุกครั้ง)
function rng(seed) {
  let a = 0; String(seed).split('').forEach(c => { a = (Math.imul(a, 31) + c.charCodeAt(0)) >>> 0; });
  return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
function digitsLayer(seed, h) {
  const r = rng(seed);
  const cols = [[10, .38], [26, .24], [764, .40], [780, .26], [606, .10], [670, .12]];
  return cols.map((c, i) => {
    const n = 7 + Math.floor(r() * 11);
    let s = ''; for (let k = 0; k < n; k++) s += (r() < .5 ? '0' : '1') + '\n';
    const top = Math.floor(r() * Math.max(10, h - n * 22 - 10));
    return `<div class="dig ${i % 2 ? 'p' : 'b'}" style="left:${c[0]}px;top:${top}px;opacity:${c[1]}">${s}</div>`;
  }).join('');
}

let pass = '';
let state = { rows: [], tabs: CONFIG.TABS, tab: '', q: '' };

function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2800);
}

async function call(action, data) {
  if (CONFIG.API.indexOf('http') !== 0) return { ok: false, msg: 'ยังไม่ได้ใส่ลิงก์ API ใน CONFIG' };
  try {
    const r = await fetch(CONFIG.API, { method: 'POST', body: JSON.stringify(Object.assign({ action, pass }, data || {})) });
    return await r.json();
  } catch (e) {
    return { ok: false, msg: 'เชื่อมต่อไม่ได้' };
  }
}

// ====== ล็อกอิน ======
let loggingIn = false;
async function login(p, fx) {
  if (loggingIn) return;
  loggingIn = true;
  pass = p;
  const r = await call('admin_ping');
  if (r.ok) {
    try { sessionStorage.setItem('adm', p); } catch (e) {}
    const enter = () => {
      $('#login').hidden = true; $('#app').hidden = false;
      fillTabs(); load();
      const a = $('#app'); a.classList.remove('vin'); void a.offsetWidth; a.classList.add('vin');
    };
    if (fx) playIntro(enter); else enter();
  } else {
    pass = '';
    toast(r.msg || 'เข้าสู่ระบบไม่สำเร็จ');
    loggingIn = false;
  }
}

// ====== เอฟเฟกต์ตอนเข้าสู่ระบบ (อุโมงค์แสง > แฟลช > ข้อความ > เฟดเข้าหน้าแอดมิน) แตะเพื่อข้ามได้ ======
function playIntro(onMid) {
  const el = $('#intro'), cv = $('#introC'), fl = el.querySelector('.intro-flash'), tx = el.querySelector('.intro-txt');
  let midDone = false;
  const mid = () => { if (!midDone) { midDone = true; onMid(); } };
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { mid(); return; }
  const dpr = Math.min(devicePixelRatio || 1, 2), W = innerWidth, H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr);
  const cx = W / 2, cy = H / 2, maxR = Math.hypot(W, H) / 2 + 40;
  const pick = () => { const z = Math.random(); return z < .12 ? 'hsla(32,100%,62%,.9)' : z < .35 ? 'hsla(200,70%,94%,.95)' : `hsla(${190 + Math.random() * 28},100%,${62 + Math.random() * 12}%,.9)`; };
  const st = Array.from({ length: 150 }, () => ({ a: Math.random() * 6.283, r: Math.random() * maxR * .2, v: .45 + Math.random() * .9, h: Math.random() * 360, w: .8 + Math.random() * 1.6, c: pick() }));
  el.hidden = false; void el.offsetWidth; el.classList.add('on');
  const sao = el.dataset.theme === 'sao';
  const T0 = performance.now(); let last = T0, flashed = false, texted = false, done = false, raf = 0;
  const finish = () => {
    if (done) return; done = true; cancelAnimationFrame(raf); mid();
    el.classList.add('out');
    setTimeout(() => { el.hidden = true; el.classList.remove('on', 'out'); tx.classList.remove('show'); fl.classList.remove('go'); }, 620);
  };
  el.onclick = finish;
  const frame = now => {
    if (done) return;
    const t = now - T0, dt = Math.min(48, now - last); last = now;
    const f = t < 1000 ? 1 + Math.pow(t / 1000, 2) * 14 : 1.6;
    ctx.fillStyle = sao ? 'rgba(0,10,24,.26)' : 'rgba(0,0,0,.26)'; ctx.fillRect(0, 0, W, H);
    for (const q of st) {
      q.r += q.v * f * dt * .22;
      const len = (3 + f * 7) * q.v;
      if (q.r > maxR) { q.r = Math.random() * 30; q.a = Math.random() * 6.283; }
      const x1 = cx + Math.cos(q.a) * q.r, y1 = cy + Math.sin(q.a) * q.r;
      const x2 = cx + Math.cos(q.a) * (q.r + len), y2 = cy + Math.sin(q.a) * (q.r + len);
      ctx.strokeStyle = sao ? q.c : `hsla(${(q.h + t * .25) % 360},100%,68%,.9)`; ctx.lineWidth = q.w; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    }
    if (t >= 1000 && !flashed) { flashed = true; fl.classList.add('go'); }
    if (t >= 1250 && !texted) { texted = true; mid(); tx.classList.add('show'); }
    if (t >= 2450) { finish(); return; }
    raf = requestAnimationFrame(frame);
  };
  raf = requestAnimationFrame(frame);
}
$('#btnLogin').onclick = () => login($('#pw').value, true);
$('#pw').onkeydown = e => { if (e.key === 'Enter') login($('#pw').value, true); };
$('#btnOut').onclick = () => { try { sessionStorage.removeItem('adm'); } catch (e) {} location.reload(); };
try { const p = sessionStorage.getItem('adm'); if (p) login(p); } catch (e) {}

// ====== เมนู ======
document.querySelectorAll('.nav button').forEach((b, idx) => b.onclick = () => {
  document.querySelectorAll('.nav button').forEach(x => x.classList.toggle('on', x === b));
  $('.nav').style.setProperty('--i', idx);
  ['list', 'add', 'tmn'].forEach(v => $('#v-' + v).hidden = (v !== b.dataset.v));
  const sec = $('#v-' + b.dataset.v); sec.classList.remove('vin'); void sec.offsetWidth; sec.classList.add('vin');
  if (b.dataset.v === 'tmn') loadTmn();
});
$('#btnRefresh').onclick = () => { load(); if (!$('#v-tmn').hidden) loadTmn(); };

function statusOpts(cur) {
  const list = [];
  CONFIG.STATUSES.concat(state.rows.map(x => x.s), cur ? [cur] : []).forEach(s => { if (s && list.indexOf(s) < 0) list.push(s); });
  return list.map(s => `<option value="${esc(s)}"${s === cur ? ' selected' : ''}>${esc(s)}</option>`).join('');
}

function fillTabs() {
  $('#aTab').innerHTML = state.tabs.map(t => `<option>${esc(t)}</option>`).join('');
  $('#aS').innerHTML = statusOpts($('#aS').value || CONFIG.STATUSES[0]);
}

// ====== รายการคิว ======
async function load() {
  const r = await call('admin_list');
  if (!r.ok) { toast(r.msg || 'โหลดไม่ได้'); return; }
  state.rows = r.rows; state.tabs = r.tabs || state.tabs;
  fillTabs(); renderChips(); renderList();
}

function renderChips() {
  const all = [''].concat(state.tabs);
  $('#ddMenu').innerHTML = all.map(t => `<button type="button" role="option" data-t="${esc(t)}" class="${t === state.tab ? 'on' : ''}"><span>${t ? esc(t) : 'ทั้งหมด'}</span><i></i></button>`).join('');
  $('#ddLabel').textContent = state.tab || 'ทั้งหมด';
}
function ddOpen(o) { $('#fTabDd').classList.toggle('open', o); $('#ddBtn').setAttribute('aria-expanded', o); }
$('#ddBtn').onclick = e => { e.stopPropagation(); if (typeof ddCloseAll === 'function') ddCloseAll(); ddOpen(!$('#fTabDd').classList.contains('open')); };
$('#ddMenu').onclick = e => {

function renderList() {
  const rows = state.rows.filter(r =>
    (!state.tab || r.tab === state.tab) &&
    (!state.q || r.n.toLowerCase().indexOf(state.q) > -1 || r.id.replace('#', '').indexOf(state.q.replace('#', '')) > -1));
  if (!rows.length) { $('#list').innerHTML = '<p class="mut">ไม่พบคิว</p>'; return; }
  $('#list').innerHTML = rows.map(r => `
    <div class="row" data-tab="${esc(r.tab)}" data-row="${r.row}" data-id="${esc(r.id)}">
      <div class="rh"><b>${esc(r.id || '—')}</b><span>${esc(r.n)}</span><small>${esc(r.tab)} · อัปเดต ${esc(r.d)}</small></div>
      <div class="grid">
        <label>ชื่อ<input class="f-n" value="${esc(r.n)}"></label>
        <label>สถานะ<select class="f-s">${statusOpts(r.s)}</select></label>
        <label>คิว<input class="f-q" value="${esc(r.q)}"></label>
        <label>ทั้งหมด<input class="f-t" type="number" min="0" value="${r.tot}"></label>
        <label>เสร็จ<input class="f-d" type="number" min="0" value="${r.done}"></label>
      </div>
      <div class="acts">
        <button class="pri" data-a="save">บันทึก</button>
        <button data-a="daily">อัปเดตรายวัน</button>
        <button data-a="card">การ์ด</button>
        <button class="dan" data-a="del">ลบ</button>
      </div>
    </div>`).join('');
}

$('#list').onclick = async e => {
  const b = e.target.closest('button[data-a]'); if (!b) return;
  const el = b.closest('.row');
  const base = { tab: el.dataset.tab, row: Number(el.dataset.row), id: el.dataset.id };
  const get = c => el.querySelector(c).value;
  if (b.dataset.a === 'card') {
    openCard({ tab: base.tab, id: base.id, n: get('.f-n'), tot: get('.f-t') });
  } else if (b.dataset.a === 'daily') {
    const rr = state.rows.find(x => x.tab === base.tab && x.row === base.row && x.id === base.id);
    if (rr) openDaily(rr); else toast('ไม่พบข้อมูล กดรีเฟรชก่อน');
  } else if (b.dataset.a === 'save') {
    b.disabled = true;
    const r = await call('admin_update', Object.assign({ n: get('.f-n'), s: get('.f-s'), q: get('.f-q'), tot: get('.f-t'), done: get('.f-d') }, base));
    b.disabled = false;
    toast(r.ok ? 'บันทึกแล้ว' : (r.msg || 'บันทึกไม่ได้'));
    if (r.ok) load();
  } else if (b.dataset.a === 'del') {
    if (!confirm('ลบคิว ' + (base.id || '') + ' ' + get('.f-n') + ' ?')) return;
    const r = await call('admin_delete', base);
    toast(r.ok ? 'ลบแล้ว' : (r.msg || 'ลบไม่ได้'));
    load();
  }
};

async function renderCanvas(html) {
  if (typeof html2canvas === 'undefined') throw new Error('โหลดตัวสร้างรูปไม่ได้ (ต้องต่ออินเทอร์เน็ต)');
  if (document.fonts && document.fonts.ready) await document.fonts.ready;
  const host = document.createElement('div');
  host.style.cssText = 'position:fixed;left:-10000px;top:0';
  host.innerHTML = html;
  document.body.appendChild(host);
  try { return await html2canvas(host.firstElementChild, { scale: 3, backgroundColor: null, useCORS: true }); }
  finally { host.remove(); }
}

const toBlob = c => new Promise(res => c.toBlob(res, 'image/png'));
const fileName = () => 'order-' + ($('#cCode').value || 'card').replace('#', '') + '.png';

$('#btnSave').onclick = async () => {
  try {
    const blob = await toBlob(await renderCanvas(cardHTML(cardVals())));
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = fileName();
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast('บันทึกรูปแล้ว');
  } catch (e) { toast(e.message || 'สร้างรูปไม่ได้'); }
};

$('#btnShare').onclick = async () => {
  try {
    const blob = await toBlob(await renderCanvas(cardHTML(cardVals())));
    const f = new File([blob], fileName(), { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [f] })) await navigator.share({ files: [f] });
    else toast('เครื่องนี้ไม่รองรับการแชร์ ใช้ปุ่มบันทึกรูปแทน');
  } catch (e) { if (e.name !== 'AbortError') toast(e.message || 'แชร์ไม่ได้'); }
};

// ====== การ์ดอัปเดตรายวัน ======
const DAILY = { tab: '', row: 0, id: '', tot: 0, baseDone: 0, hist: [], saved: false };
const thDate = (day, short) => {
  const d = new Date(day + 'T00:00:00');
  if (isNaN(d)) return day;
  return d.toLocaleDateString('th-TH', short ? { day: 'numeric', month: 'short' } : { day: 'numeric', month: 'short', year: 'numeric' });
};
const todayKey = () => new Date().toLocaleDateString('sv-SE');
const sgn = n => (n >= 0 ? '+' : '-') + fmt(Math.abs(n));

function mergeHist(hist, day, gain) {
  const m = {};
  hist.forEach(x => { m[x.day] = (m[x.day] || 0) + x.gain; });
  if (gain) m[day] = (m[day] || 0) + gain;
  return Object.keys(m).sort().reverse().map(k => ({ day: k, gain: m[k] }));
}

function dailyVals() {
  const gain = Number($('#dGain').value) || 0, day = $('#dDay').value || todayKey();
  const cum = DAILY.saved ? DAILY.baseDone : DAILY.baseDone + gain;
  const hist = DAILY.saved ? DAILY.hist : mergeHist(DAILY.hist, day, gain);
  return {
    name: $('#dName').value || '-', code: DAILY.id || '#----', job: DAILY.tab, gain, day,
    cum: Math.max(0, cum), tot: DAILY.tot, hist: hist.slice(0, 4),
    unit: CONFIG.UNIT_SHORT[DAILY.tab] || '', label: CONFIG.DAILY_LABEL[DAILY.tab] || 'วันนี้ทำได้'
  };
}

    <div class="bar"><i style="width:${pct > 0 ? Math.max(pct, 2) : 0}%"></i></div>
    <div class="psub"><span>คืบหน้า ${pct}%</span><span>คงเหลือ ${fmt(remain)} ${esc(v.unit)}</span></div>

async function openDaily(r) {
  Object.assign(DAILY, { tab: r.tab, row: r.row, id: r.id, tot: Number(r.tot) || 0, baseDone: Number(r.done) || 0, hist: [], saved: false });
  $('#dName').value = r.n;
  $('#dPhoto').value = '';
  $('#dCur').value = '';
  $('#dGain').value = '';
  $('#dDay').value = todayKey();
  ['#dCur', '#dGain', '#dDay', '#btnDSheet'].forEach(s => $(s).disabled = false);
  dMsgIdle();
  $('#ov2').hidden = false;
  drawDaily();
  const hr = await call('admin_history', { id: r.id });
  if (hr.ok && DAILY.id === r.id && !DAILY.saved) { DAILY.hist = hr.history; drawDaily(); }
}

const r2 = x => Math.round(x * 100) / 100;
function dMsgIdle() {
  $('#dMsg').textContent = 'ในชีตตอนนี้สะสม ' + fmt(DAILY.baseDone) + ' / ' + fmt(DAILY.tot) + ' · ใส่ "ยอดปัจจุบัน" แล้วระบบหักลบให้เอง · กด "บันทึกลงชีต" เพื่อเก็บยอดเข้าชีต (ถ้าต้องการแค่ทำรูปให้ข้ามได้)';
}
function dMsgCalc() {
  if (DAILY.saved) return;
  const cur = $('#dCur').value, g = Number($('#dGain').value) || 0;
  if (cur === '') { dMsgIdle(); return; }
  $('#dMsg').textContent = fmt(Number(cur)) + ' − ' + fmt(DAILY.baseDone) + ' (ยอดในชีต) = ' + sgn(g) + (Number(cur) < DAILY.baseDone ? ' · ⚠ ยอดน้อยกว่าในชีต เช็คตัวเลขอีกครั้ง' : '');
}
// ใส่ยอดปัจจุบัน -> ได้วันนี้ = ยอดปัจจุบัน - ยอดสะสมในชีต
$('#dCur').oninput = () => {
  const c = $('#dCur').value;
  $('#dGain').value = c === '' ? '' : r2(Number(c) - DAILY.baseDone);
  dMsgCalc(); drawDaily();
};
// แก้ช่องได้วันนี้เอง -> ยอดปัจจุบันปรับตาม
$('#dGain').oninput = () => {
  const g = $('#dGain').value;
  $('#dCur').value = g === '' ? '' : r2(DAILY.baseDone + Number(g));
  dMsgCalc(); drawDaily();
};
['#dName', '#dDay'].forEach(s => $(s).oninput = drawDaily);
$('#btnDClose').onclick = () => { $('#ov2').hidden = true; };
window.addEventListener('resize', () => { if (!$('#ov2').hidden) drawDaily(); });

$('#btnDSheet').onclick = async () => {
  const gain = Number($('#dGain').value);
  if (!gain) { toast('ใส่จำนวนที่ได้วันนี้ก่อน'); return; }
  $('#btnDSheet').disabled = true;
  const r = await call('admin_daily', { tab: DAILY.tab, row: DAILY.row, id: DAILY.id, gain, day: $('#dDay').value || todayKey(), note: '' });
  if (!r.ok) { $('#btnDSheet').disabled = false; toast(r.msg || 'บันทึกไม่ได้'); return; }
  DAILY.saved = true; DAILY.baseDone = r.done; DAILY.tot = r.tot; DAILY.hist = r.history;
  ['#dCur', '#dGain', '#dDay'].forEach(s => $(s).disabled = true);
  $('#dMsg').textContent = 'บันทึกลงชีตแล้ว สะสมตอนนี้ ' + r.done.toLocaleString('en-US') + ' / ' + r.tot.toLocaleString('en-US');
  toast('บันทึกลงชีตแล้ว');
  load(); drawDaily();
};

const dFile = () => 'daily-' + (DAILY.id || 'card').replace('#', '') + '-' + ($('#dDay').value || todayKey()).replace(/-/g, '') + '.png';

$('#btnDPng').onclick = async () => {
  try {
    const blob = await toBlob(await renderCanvas(dailyCardHTML(dailyVals())));
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = dFile();
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast('บันทึกรูปแล้ว');
  } catch (e) { toast(e.message || 'สร้างรูปไม่ได้'); }
};

$('#btnDShare').onclick = async () => {
  try {
    const blob = await toBlob(await renderCanvas(dailyCardHTML(dailyVals())));
    const f = new File([blob], dFile(), { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [f] })) await navigator.share({ files: [f] });
    else toast('เครื่องนี้ไม่รองรับการแชร์ ใช้ปุ่มบันทึกรูปแทน');
  } catch (e) { if (e.name !== 'AbortError') toast(e.message || 'แชร์ไม่ได้'); }
};

// ====== อัปโหลดรูปตัวละคร ======
// ตัดรูปให้พอดีกรอบ (cover, ชิดบน) และปรับขนาดเป็นพิกเซลจริงที่ใช้บนการ์ด (กรอบ 250x330 x3)
// ย่อ/ขยายทีละขั้นเพื่อไม่ให้แตก แล้วเพิ่มความคมเล็กน้อย กรอบจึงถูกวาดแบบ 1:1 ตอนบันทึกรูป ไม่ว่ารูปต้นฉบับจะขนาดเท่าไหร่
const PHOTO_W = 750, PHOTO_H = 990;
function preparePhoto(img, W, H) {
  const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
  const sc = Math.max(W / iw, H / ih);
  const sw = W / sc, sh = H / sc, sx = (iw - sw) / 2;
  const mk = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); const x = c.getContext('2d'); x.imageSmoothingEnabled = true; x.imageSmoothingQuality = 'high'; return c; };
  let cur = mk(sw, sh);
  cur.getContext('2d').drawImage(img, sx, 0, sw, sh, 0, 0, cur.width, cur.height);
  const up = W / cur.width;                                   // ขยายกี่เท่า (>1 = รูปต้นฉบับเล็กกว่ากรอบ)
  while (cur.width >= W * 2) {                                // ย่อทีละครึ่ง
    const n = mk(Math.max(W, cur.width / 2), Math.max(H, cur.height / 2));
    n.getContext('2d').drawImage(cur, 0, 0, n.width, n.height); cur = n;
  }
  while (cur.width * 1.5 < W) {                               // ขยายทีละ 1.5 เท่า
    const n = mk(cur.width * 1.5, cur.height * 1.5);
    n.getContext('2d').drawImage(cur, 0, 0, n.width, n.height); cur = n;
  }
  const out = mk(W, H);
  out.getContext('2d').drawImage(cur, 0, 0, W, H);
  // เพิ่มความคม (ขยายมากยิ่งเพิ่มมากขึ้น)
  const a = up > 1.15 ? Math.min(0.4, 0.15 + 0.08 * Math.log2(up)) : 0;
  if (a > 0) try {
    const cx = out.getContext('2d'), src = cx.getImageData(0, 0, W, H), d = src.data, o = new Uint8ClampedArray(d);
    for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) {
      const i = (y * W + x) * 4;
      for (let c = 0; c < 3; c++) {
        const k = i + c;
        o[k] = (1 + 4 * a) * d[k] - a * (d[k - 4] + d[k + 4] + d[k - W * 4] + d[k + W * 4]);
      }
    }
    cx.putImageData(new ImageData(o, W, H), 0, 0);
  } catch (e) {}
  return out;
}
function pickPhoto(sel, codeFn, redraw) {
  $(sel).onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const url = URL.createObjectURL(f), img = new Image();
    img.onload = () => {
      PHOTOS[codeFn()] = preparePhoto(img, PHOTO_W, PHOTO_H).toDataURL('image/png');
      URL.revokeObjectURL(url); redraw();
    };
    img.onerror = () => { URL.revokeObjectURL(url); toast('เปิดรูปไม่ได้'); };
    img.src = url;
  };
}
pickPhoto('#cPhoto', () => $('#cCode').value || '#----', drawPreview);
pickPhoto('#dPhoto', () => DAILY.id || '#----', drawDaily);

// ====== สีการ์ด ======
['#cTheme', '#dTheme'].forEach(s => { $(s).innerHTML = THEMES.map(t => `<option value="${t[0]}">${esc(t[1])}</option>`).join(''); $(s).value = THEME; });
function setTheme(t) {
  THEME = t;
  try { localStorage.setItem('cardTheme2', t); } catch (e) {}
  $('#cTheme').value = t; $('#dTheme').value = t;
  if (!$('#ov').hidden) drawPreview();

}

$('#dTheme').onchange = e => setTheme(e.target.value);

// ====== เลขไบนารีวิ่งพื้นหลัง ======
(function () {
  const cv = $('#rain'); if (!cv) return;
  const ctx = cv.getContext('2d');
  const still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W = 0, H = 0, cols = [];
  function mk(x) {
    const len = 6 + Math.floor(Math.random() * 12), s = [];
    for (let i = 0; i < len; i++) s.push(Math.random() < .5 ? '0' : '1');
    return { x, y: Math.random() * H - len * 22, v: .35 + Math.random() * .9, s, c: (z => z < .5 ? '90,200,255' : z < .85 ? '215,230,242' : '246,201,21')(Math.random()), a: .14 + Math.random() * .3 };
  }
  function init() {
    W = cv.width = innerWidth; H = cv.height = innerHeight;
    const n = Math.max(8, Math.floor(W / 70)); cols = [];
    for (let i = 0; i < n; i++) cols.push(mk(i * (W / n) + Math.random() * (W / n) * .6));
  }
  function frame() {
    ctx.clearRect(0, 0, W, H);
    ctx.font = '700 16px monospace'; ctx.textAlign = 'center';
    cols.forEach(c => {
      for (let i = 0; i < c.s.length; i++) {
        const y = c.y + i * 22;
        if (y < -22 || y > H + 22) continue;
        ctx.fillStyle = 'rgba(' + c.c + ',' + (c.a * (i + 1) / c.s.length).toFixed(3) + ')';
        ctx.fillText(c.s[i], c.x, y);
      }
      if (!still) {
        c.y += c.v;
        if (Math.random() < .02) c.s[Math.floor(Math.random() * c.s.length)] = Math.random() < .5 ? '0' : '1';
        if (c.y > H + 20) { const nn = mk(Math.random() * W); nn.y = -nn.s.length * 22; Object.assign(c, nn); }
      }
    });
    if (!still) requestAnimationFrame(frame);
  }
  init(); frame();
  addEventListener('resize', () => { init(); if (still) frame(); });
})();

// ====== ดรอปดาวน์แบบเดียวกันทุกจุด (แทนป๊อปอัปของระบบ) ======
const DDS = new Set();
let ddCur = null;
function ddCloseAll() {
  if (!ddCur) return;
  ddCur.menu.classList.remove('open'); ddCur.wrap.classList.remove('open');
  ddCur.btn.setAttribute('aria-expanded', 'false'); ddCur = null;
}
function enhanceSelect(sel) {
  const wrap = document.createElement('div'); wrap.className = 'dd sel';
  wrap.innerHTML = '<button type="button" class="dd-btn" aria-haspopup="listbox" aria-expanded="false"><span></span><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>';
  const btn = wrap.firstChild, lab = btn.querySelector('span');
  const menu = document.createElement('div'); menu.className = 'dd-menu fx'; menu.setAttribute('role', 'listbox');
  document.body.appendChild(menu);
  sel.style.display = 'none'; sel.after(wrap);
  const ent = { sel, wrap, btn, menu };
  const sync = () => {
    const o = sel.options[sel.selectedIndex];
    lab.textContent = o ? o.text : '';
    menu.innerHTML = Array.from(sel.options).map((x, i) =>
      `<button type="button" role="option" data-i="${i}" class="${i === sel.selectedIndex ? 'on' : ''}"><span>${esc(x.text)}</span><i></i></button>`).join('');
  };
  // ตั้งค่า .value ผ่านโค้ดแล้วให้ปุ่มอัปเดตตามด้วย
  const d = Object.getOwnPropertyDescriptor(HTMLSelectElement.prototype, 'value');
  Object.defineProperty(sel, 'value', { get() { return d.get.call(this); }, set(v) { d.set.call(this, v); sync(); }, configurable: true });
  new MutationObserver(sync).observe(sel, { childList: true, subtree: true });
  sync();
  btn.onclick = e => {
    e.stopPropagation();
    if (ddCur === ent) { ddCloseAll(); return; }
    ddCloseAll(); ddOpen(false);
    const r = btn.getBoundingClientRect();
    menu.style.minWidth = r.width + 'px';
    menu.style.maxHeight = '';
    menu.classList.add('open'); wrap.classList.add('open'); btn.setAttribute('aria-expanded', 'true');
    const below = innerHeight - r.bottom - 14, above = r.top - 14;
    const h = Math.min(menu.scrollHeight, 320);
    const up = h > below && above > below;
    menu.style.maxHeight = Math.max(120, Math.min(320, up ? above : below)) + 'px';
    const mh = Math.min(h, parseFloat(menu.style.maxHeight));
    menu.style.top = (up ? r.top - mh - 8 : r.bottom + 8) + 'px';
    menu.style.transformOrigin = up ? 'bottom left' : 'top left';
    const mw = menu.offsetWidth;
    menu.style.left = Math.max(8, Math.min(r.left, innerWidth - mw - 8)) + 'px';
    ddCur = ent;
    const on = menu.querySelector('.on'); if (on) on.scrollIntoView({ block: 'nearest' });
  };
  menu.onclick = e => {
    const b = e.target.closest('button[data-i]'); if (!b) return;
    sel.selectedIndex = Number(b.dataset.i); sync();
    sel.dispatchEvent(new Event('input', { bubbles: true }));
    sel.dispatchEvent(new Event('change', { bubbles: true }));
    ddCloseAll();
  };
  DDS.add(ent);
}
function enhanceAll() {
  document.querySelectorAll('select:not([data-dd])').forEach(x => { x.dataset.dd = '1'; enhanceSelect(x); });
  DDS.forEach(e => { if (!document.body.contains(e.sel)) { if (ddCur === e) ddCur = null; e.menu.remove(); DDS.delete(e); } });
}
document.addEventListener('click', e => { if (!e.target.closest('.dd') && !e.target.closest('.dd-menu')) ddCloseAll(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') ddCloseAll(); });
window.addEventListener('resize', ddCloseAll);
window.addEventListener('scroll', e => { if (ddCur && !ddCur.menu.contains(e.target)) ddCloseAll(); }, true);
new MutationObserver(enhanceAll).observe(document.body, { childList: true, subtree: true });
enhanceAll();
</script>
