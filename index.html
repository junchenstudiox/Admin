<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ยินดีต้อนรับ แอดมิน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{--bg:#070a1a;--panel:rgba(58,50,140,.26);--line:rgba(170,160,255,.30);--tx:#f2f3ff;--mut:#a9acd9;--acc:#c98bff;--ok:#4be3a8;--bad:#ff7a9c;--g:linear-gradient(135deg,#7f8fff 0%,#c77dff 60%,#ff85c0 100%)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--tx);font-family:'Prompt',system-ui,sans-serif;font-size:15px;line-height:1.5;background:radial-gradient(circle at 85% 45%,rgba(190,70,210,.28),transparent 45%),radial-gradient(circle at 10% 65%,rgba(70,100,235,.25),transparent 45%),linear-gradient(180deg,#070a1f 0%,#0c0a24 100%);background-attachment:fixed}
button,input,select{font:inherit;color:inherit}
input,select{background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:12px;padding:9px 12px;width:100%;min-width:0}
input::placeholder{color:var(--mut)}
select option{background:#14183f;color:#fff}
input:focus,select:focus{outline:2px solid var(--acc);outline-offset:-1px}
button{cursor:pointer;border:1px solid var(--line);background:rgba(255,255,255,.06);border-radius:999px;padding:9px 18px}
button:hover{border-color:var(--acc)}
button.pri,.nav button.on{background:var(--g);color:#fff;border-color:transparent;font-weight:600;box-shadow:0 4px 18px rgba(170,110,255,.35)}
button.dan{color:var(--bad)}
button:disabled{opacity:.5;cursor:default}
.wrap{max-width:980px;margin:0 auto;padding:16px}
.login,.row,.form,.modal{background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:0 0 32px rgba(120,100,255,.18)}
.login{max-width:360px;margin:15vh auto 0;padding:24px}
.login h1{margin:0 0 14px;font-size:20px}
.login .gap{margin-top:10px}
.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.top h1{font-size:20px;margin:0 auto 0 0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chips button{padding:6px 16px;font-size:14px;border-color:#3d6bff;background:rgba(20,26,80,.55)}
.chips button.on{border-color:#ff5fa8;color:#fff;box-shadow:0 0 14px rgba(255,95,168,.3)}
.row{padding:14px;margin-bottom:12px}
.rh{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:8px}
.rh b{color:var(--acc);font-size:18px}
.rh small{color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.grid label,.form label{display:block;font-size:12px;color:var(--mut)}
.grid input,.grid select{margin-top:2px}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.form{padding:16px}
.form .grid{margin-bottom:12px}
.form input,.form select{margin-top:2px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl td,.tbl th{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{color:var(--mut);font-weight:500}
.tag{padding:2px 10px;border-radius:999px;font-size:12px;border:1px solid var(--line)}
.tag.ok{color:var(--ok);border-color:var(--ok)}
.tag.bad{color:var(--bad);border-color:var(--bad)}
.tag.wait{color:var(--acc);border-color:var(--acc)}
.mut{color:var(--mut)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1d1f55;border:1px solid var(--line);padding:10px 20px;border-radius:999px;z-index:99;max-width:90vw;box-shadow:0 0 24px rgba(150,110,255,.35)}
.ov{position:fixed;inset:0;background:rgba(5,6,20,.82);z-index:50;overflow:auto;padding:16px}
.modal{max-width:880px;margin:0 auto;padding:16px;background:rgba(22,20,70,.96)}
.modal h2{margin:0 0 12px;font-size:17px}
.pv{width:100%;overflow:hidden;border-radius:20px;margin-bottom:14px}
.pvi{transform-origin:top left}
[hidden]{display:none!important}

/* ===== การ์ด (ขนาดจริง 800x520 ใช้เป็นรูปตอนบันทึก) — สีมาจากธีม .t-xxx ===== */
.card.t-night{--bg:linear-gradient(135deg,#1c2060 0%,#0d1033 52%,#35145f 100%);--tx:#f4f5ff;--mut:rgba(222,224,255,.64);--acc:#d9cbff;--glow:rgba(150,120,255,.8);--pill-bg:rgba(255,255,255,.10);--pill-bd:rgba(255,255,255,.38);--pill-tx:#e9e0ff;--seal:radial-gradient(circle at 30% 28%,#9aa6ff 0%,#c77dff 52%,#5b2fb0 100%);--seal-bd:rgba(255,255,255,.5);--dot:#ffffff;--line:rgba(255,255,255,.16);--ring:rgba(255,255,255,.07);--sheen:linear-gradient(115deg,rgba(255,255,255,0) 22%,rgba(255,255,255,.11) 40%,rgba(255,255,255,0) 56%);--bar-bg:rgba(255,255,255,.14);--bar-fill:linear-gradient(90deg,#7f8fff,#ff85c0);--chip-bg:rgba(255,255,255,.08);--chip-bd:rgba(255,255,255,.26);--dig1:#5b8cff;--dig2:#ff5fa8}
.card.t-graphite{--bg:linear-gradient(135deg,#505667 0%,#272b35 36%,#171a21 56%,#414756 100%);--tx:#f1f3f8;--mut:rgba(226,230,241,.62);--acc:#eef1f8;--glow:rgba(255,255,255,.35);--pill-bg:rgba(255,255,255,.08);--pill-bd:rgba(232,236,246,.5);--pill-tx:#eef1f8;--seal:radial-gradient(circle at 30% 28%,#ffffff 0%,#cfd5e0 52%,#7e8798 100%);--seal-bd:rgba(30,34,44,.35);--dot:#2a2e38;--line:rgba(255,255,255,.15);--ring:rgba(255,255,255,.06);--sheen:linear-gradient(115deg,rgba(255,255,255,0) 22%,rgba(255,255,255,.16) 40%,rgba(255,255,255,0) 56%);--bar-bg:rgba(255,255,255,.14);--bar-fill:linear-gradient(90deg,#aab2c3,#f6f8fc);--chip-bg:rgba(255,255,255,.08);--chip-bd:rgba(255,255,255,.28);--dig1:#8fb0ff;--dig2:#ff8fc0}
.card.t-pearl{--bg:linear-gradient(135deg,#f8f9fc 0%,#d3d8e1 28%,#f1f3f7 48%,#b8bfcc 72%,#e8ebf0 100%);--tx:#1d2233;--mut:rgba(29,34,51,.58);--acc:#3a2f9e;--glow:rgba(0,0,0,0);--pill-bg:rgba(75,63,168,.10);--pill-bd:rgba(75,63,168,.38);--pill-tx:#4338a8;--seal:radial-gradient(circle at 30% 28%,#ffffff 0%,#d5dae3 50%,#8f98aa 100%);--seal-bd:rgba(40,48,70,.28);--dot:#2f2a7a;--line:rgba(29,34,51,.16);--ring:rgba(40,48,70,.09);--sheen:linear-gradient(115deg,rgba(255,255,255,0) 22%,rgba(255,255,255,.7) 40%,rgba(255,255,255,0) 56%);--bar-bg:rgba(29,34,51,.14);--bar-fill:linear-gradient(90deg,#7a70e0,#3a2f9e);--chip-bg:rgba(255,255,255,.55);--chip-bd:rgba(29,34,51,.22);--dig1:#4b6bd6;--dig2:#c2478a}
.card.t-ice{--bg:linear-gradient(135deg,#f3f8ff 0%,#c9d8f2 35%,#eaf1ff 55%,#a9bde3 100%);--tx:#14224d;--mut:rgba(20,34,77,.6);--acc:#2447d6;--glow:rgba(0,0,0,0);--pill-bg:rgba(36,71,214,.10);--pill-bd:rgba(36,71,214,.4);--pill-tx:#2447d6;--seal:radial-gradient(circle at 30% 28%,#ffffff 0%,#cfdcf5 50%,#7f95c8 100%);--seal-bd:rgba(20,34,77,.28);--dot:#2447d6;--line:rgba(20,34,77,.16);--ring:rgba(20,34,77,.08);--sheen:linear-gradient(115deg,rgba(255,255,255,0) 22%,rgba(255,255,255,.75) 40%,rgba(255,255,255,0) 56%);--bar-bg:rgba(20,34,77,.14);--bar-fill:linear-gradient(90deg,#6f8cff,#2447d6);--chip-bg:rgba(255,255,255,.6);--chip-bd:rgba(20,34,77,.22);--dig1:#2447d6;--dig2:#d6479b}

.card{width:800px;height:520px;position:relative;overflow:hidden;border-radius:36px;background:var(--bg);color:var(--tx);font-family:'Prompt',sans-serif}
.card.daily{height:560px}
.card .sheen{position:absolute;left:0;top:0;right:0;bottom:0;background:var(--sheen)}
.card .ring{position:absolute;border:1px solid var(--ring);border-radius:50%}
.card .dig{position:absolute;font-family:monospace;font-size:16px;line-height:22px;font-weight:700;white-space:pre}
.card .dig.b{color:var(--dig1)}
.card .dig.p{color:var(--dig2)}
.card .brand{position:absolute;left:44px;top:34px;font-size:25px;font-weight:700;line-height:1.4;letter-spacing:.5px}
.card .pill{position:absolute;right:44px;top:32px;padding:6px 20px;border-radius:999px;background:var(--pill-bg);color:var(--pill-tx);font-size:20px;font-weight:600;border:1px solid var(--pill-bd);line-height:1.4}
.card .l1,.card .l2,.card .lb,.card .lbx,.card .dg-l,.card .dg-u{color:var(--mut)}
.card .l1{position:absolute;left:44px;top:100px;font-size:19px;line-height:1.4}
.card .l2{position:absolute;left:44px;top:256px;font-size:19px;line-height:1.4}
.card .code{position:absolute;left:40px;top:128px;font-size:104px;font-weight:800;line-height:1.1;color:var(--acc);letter-spacing:2px;text-shadow:0 0 24px var(--glow)}
.card .seal{position:absolute;right:52px;top:140px;width:128px;height:128px;border-radius:50%;background:var(--seal);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.28)}
.card .seal .in{width:104px;height:104px;border-radius:50%;border:2px solid var(--seal-bd);display:flex;align-items:center;justify-content:center}
.card .seal .dot{width:46px;height:46px;border-radius:50%;background:var(--dot)}
.card .name{position:absolute;left:44px;top:288px;width:712px;font-size:44px;font-weight:700;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .hr{position:absolute;left:44px;top:366px;width:712px;height:1px;background:var(--line)}
.card .stats{position:absolute;left:44px;top:382px;width:712px;display:grid;grid-template-columns:1.1fr 1fr 1.1fr;gap:20px}
.card .st .lb{font-size:19px;line-height:1.3}
.card .st .vl{font-size:42px;font-weight:700;line-height:1.3;white-space:nowrap}
.card .st .vl.sm{font-size:30px;padding-top:8px}
.card .foot{position:absolute;left:44px;right:44px;top:478px;display:flex;justify-content:space-between;font-size:17px;color:var(--mut);line-height:1.4}
.card .dcode{position:absolute;left:44px;top:122px;font-size:60px;font-weight:800;line-height:1.1;color:var(--acc);letter-spacing:1px;text-shadow:0 0 20px var(--glow)}
.card .dname{position:absolute;left:44px;top:192px;width:380px;font-size:34px;font-weight:700;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .dg-l{position:absolute;left:450px;top:96px;font-size:19px;line-height:1.4}
.card .dg{position:absolute;left:450px;top:124px;width:306px;font-weight:800;color:var(--acc);line-height:1.15;white-space:nowrap;text-shadow:0 0 24px var(--glow)}
.card .dg-u{position:absolute;left:450px;top:224px;font-size:20px;line-height:1.4}
.card .prow{position:absolute;left:44px;top:292px;width:712px;display:flex;justify-content:space-between;align-items:baseline}
.card .lbx{font-size:19px}
.card .pval{font-size:32px;font-weight:700;line-height:1.3}
.card .bar{position:absolute;left:44px;top:346px;width:712px;height:22px;border-radius:11px;background:var(--bar-bg)}
.card .bar i{display:block;height:22px;border-radius:11px;background:var(--bar-fill)}
.card .psub{position:absolute;left:44px;top:378px;width:712px;display:flex;justify-content:space-between;font-size:19px;color:var(--mut);line-height:1.4}
.card .chips2{position:absolute;left:44px;top:466px;width:712px;display:flex;gap:10px;overflow:hidden}
.card .chip{padding:5px 14px;border-radius:999px;border:1px solid var(--chip-bd);background:var(--chip-bg);font-size:18px;font-weight:600;white-space:nowrap;line-height:1.4}
.card .mutl{font-size:18px;color:var(--mut);line-height:1.8}

/* ===== เลขไบนารีวิ่งพื้นหลังหน้าแอดมิน ===== */
#rain{position:fixed;left:0;top:0;width:100%;height:100%;z-index:0;pointer-events:none}
.wrap,.login{position:relative;z-index:1}
</style>
</head>
<body>
<canvas id="rain"></canvas>

<!-- ===== ล็อกอิน ===== -->
<div id="login" class="login">
  <h1>ยินดีต้อนรับ แอดมิน</h1>
  <input id="pw" type="password" placeholder="รหัสผ่านแอดมิน" autocomplete="current-password">
  <button id="btnLogin" class="pri gap" style="width:100%">เข้าสู่ระบบ</button>
</div>

<!-- ===== แอป ===== -->
<div id="app" class="wrap" hidden>
  <div class="top">
    <h1>ยินดีต้อนรับ แอดมิน</h1>
    <div class="nav">
      <button data-v="list" class="on">คิว</button>
      <button data-v="add">เพิ่มคิว</button>
      <button data-v="tmn">ซองทรูมันนี่</button>
    </div>
    <button id="btnRefresh">รีเฟรช</button>
    <button id="btnOut">ออก</button>
  </div>

  <section id="v-list">
    <div class="chips" id="chips"></div>
    <input id="search" placeholder="ค้นหาชื่อหรือรหัสคิว" style="margin-bottom:12px">
    <div id="list"></div>
  </section>

  <section id="v-add" hidden>
    <div class="form">
      <div class="grid">
        <label>ชนิดงาน<select id="aTab"></select></label>
        <label>ชื่อลูกค้า<input id="aN"></label>
        <label>สถานะ<select id="aS"></select></label>
        <label>คิว<input id="aQ"></label>
        <label>จำนวนทั้งหมด<input id="aT" type="number" min="0"></label>
        <label>ทำเสร็จแล้ว<input id="aD" type="number" min="0" value="0"></label>
      </div>
      <button id="btnAdd" class="pri">เพิ่มคิว (สุ่มรหัส # ให้อัตโนมัติ) แล้วสร้างการ์ด</button>
    </div>
  </section>

  <section id="v-tmn" hidden>
    <div id="tmn"></div>
  </section>
</div>

<!-- ===== ป๊อปอัปการ์ด ===== -->
<div id="ov" class="ov" hidden>
  <div class="modal">
    <h2>การ์ดลูกค้า</h2>
    <div class="pv" id="pv"><div class="pvi" id="pvi"></div></div>
    <div class="grid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:12px">
      <div class="form" style="padding:0;border:0;background:none;box-shadow:none">
        <label>ชื่อ<input id="cName"></label>
      </div>
      <div class="form" style="padding:0;border:0;background:none;box-shadow:none">
        <label>เลขคิว<input id="cCode"></label>
      </div>
      <div class="form" style="padding:0;border:0;background:none;box-shadow:none">
        <label>ชนิดงาน<input id="cJob"></label>
      </div>
      <div class="form" style="padding:0;border:0;background:none;box-shadow:none">
        <label>หัวข้อจำนวน<input id="cUnit"></label>
      </div>
      <div class="form" style="padding:0;border:0;background:none;box-shadow:none">
        <label>จำนวน<input id="cTot" type="number" min="0"></label>
      </div>
      <div class="form" style="padding:0;border:0;background:none;box-shadow:none">
        <label>ราคา (บาท)<input id="cBaht" type="number" min="0"></label>
      </div>
      <div class="form" style="padding:0;border:0;background:none;box-shadow:none">
        <label>เรท: กี่บาทต่อ 100 (ว่าง = ไม่คำนวณ)<input id="cRate" type="number" min="0" step="any"></label>
      </div>
      <div class="form" style="padding:0;border:0;background:none;box-shadow:none">
        <label>วันที่<input id="cDate"></label>
      </div>
      <div class="form" style="padding:0;border:0;background:none;box-shadow:none">
        <label>สีการ์ด<select id="cTheme"></select></label>
      </div>
    </div>
    <div class="acts">
      <button id="btnSave" class="pri">บันทึกเป็นรูป (PNG)</button>
      <button id="btnShare">แชร์รูป</button>
      <button id="btnClose">ปิด</button>
    </div>
  </div>
</div>

<!-- ===== ป๊อปอัปการ์ดรายวัน ===== -->
<div id="ov2" class="ov" hidden>
  <div class="modal">
    <h2>การ์ดอัปเดตรายวัน</h2>
    <div class="pv" id="pv2"><div class="pvi" id="pvi2"></div></div>
    <div class="grid" style="margin-bottom:10px">
      <label>ชื่อ (บนการ์ด)<input id="dName"></label>
      <label>วันนี้ได้เท่าไหร่ (ใส่ติดลบเพื่อแก้ไข)<input id="dGain" type="number" step="any"></label>
      <label>วันที่<input id="dDay" type="date"></label>
      <label>สีการ์ด<select id="dTheme"></select></label>
      <label>หมายเหตุ (บันทึกในชีต ไม่ขึ้นการ์ด)<input id="dNote"></label>
    </div>
    <p id="dMsg" class="mut" style="margin:0 0 12px;font-size:13px"></p>
    <div class="acts">
      <button id="btnDSheet" class="pri">บันทึกลงชีต</button>
      <button id="btnDPng">บันทึกเป็นรูป (PNG)</button>
      <button id="btnDShare">แชร์รูป</button>
      <button id="btnDClose">ปิด</button>
    </div>
  </div>
</div>

<script>
// ====== ตั้งค่า (แก้ตรงนี้) ======
const CONFIG = {
  API: 'https://script.google.com/macros/s/AKfycbxMuph1X06qkWnyaN9KdcC02w_qPKDxzB2nisSoOhv59f6aS9EchQzmOnOokdrVC9KjVw/exec',
  SHOP: 'Junchen Studio',
  FOOT: 'เก็บเลขคิวนี้ไว้เช็คสถานะ',
  TABS: ['ฟาร์มเพชร', 'อ่านสตอรี่'],
  // รายการสถานะในช่องเลือก (แก้ให้ตรงกับที่ใช้ในชีตได้) ระบบจะรวมกับสถานะที่มีอยู่ในชีตให้อัตโนมัติ
  STATUSES: ['รอคิว', 'กำลังทำ', 'เสร็จแล้ว'],
  UNITS: { 'ฟาร์มเพชร': 'จำนวนเพชร', 'อ่านสตอรี่': 'จำนวนสตอรี่' },
  // การ์ดรายวัน: หน่วยสั้น และข้อความหัวยอดของวัน
  UNIT_SHORT: { 'ฟาร์มเพชร': 'เพชร', 'อ่านสตอรี่': 'สตอรี่' },
  DAILY_LABEL: { 'ฟาร์มเพชร': 'วันนี้ฟาร์มได้', 'อ่านสตอรี่': 'วันนี้อ่านได้' }
};

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => { const x = Number(n); return isFinite(x) ? x.toLocaleString('en-US') : esc(n); };

const THEMES = [['night', 'ม่วงกลางคืน (เข้ากับเว็บ)'], ['graphite', 'แพลทตินัมเข้ม'], ['pearl', 'แพลทตินัมอ่อน'], ['ice', 'ฟ้าน้ำแข็ง']];
let THEME = 'night';
try { const t = localStorage.getItem('cardTheme'); if (THEMES.some(x => x[0] === t)) THEME = t; } catch (e) {}

// เลขไบนารีบนการ์ด (สุ่มจากรหัสคิว ได้ลายเดิมทุกครั้ง)
function rng(seed) {
  let a = 0; String(seed).split('').forEach(c => { a = (Math.imul(a, 31) + c.charCodeAt(0)) >>> 0; });
  return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
function digitsLayer(seed, h) {
  const r = rng(seed);
  const cols = [[10, .38], [26, .24], [764, .40], [780, .26], [606, .10], [670, .12]];
  return cols.map((c, i) => {
    const n = 7 + Math.floor(r() * 11);
    let s = ''; for (let k = 0; k < n; k++) s += (r() < .5 ? '0' : '1') + '\n';
    const top = Math.floor(r() * Math.max(10, h - n * 22 - 10));
    return `<div class="dig ${i % 2 ? 'p' : 'b'}" style="left:${c[0]}px;top:${top}px;opacity:${c[1]}">${s}</div>`;
  }).join('');
}

let pass = '';
let state = { rows: [], tabs: CONFIG.TABS, tab: '', q: '' };

function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2800);
}

async function call(action, data) {
  if (CONFIG.API.indexOf('http') !== 0) return { ok: false, msg: 'ยังไม่ได้ใส่ลิงก์ API ใน CONFIG' };
  try {
    const r = await fetch(CONFIG.API, { method: 'POST', body: JSON.stringify(Object.assign({ action, pass }, data || {})) });
    return await r.json();
  } catch (e) {
    return { ok: false, msg: 'เชื่อมต่อไม่ได้' };
  }
}

async function login(p) {
  pass = p;

  if (r.ok) {

}

async function load() {
  const r = await call('admin_list');
  if (!r.ok) { toast(r.msg || 'โหลดไม่ได้'); return; }
  state.rows = r.rows; state.tabs = r.tabs || state.tabs;
  fillTabs(); renderChips(); renderList();
}

function renderChips() {
  const all = [''].concat(state.tabs);
  $('#chips').innerHTML = all.map(t => `<button data-t="${esc(t)}" class="${t === state.tab ? 'on' : ''}">${t ? esc(t) : 'ทั้งหมด'}</button>`).join('');
}
$('#chips').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  state.tab = b.dataset.t; renderChips(); renderList();
};
$('#search').oninput = e => { state.q = e.target.value.trim().toLowerCase(); renderList(); };

function renderList() {
  const rows = state.rows.filter(r =>
    (!state.tab || r.tab === state.tab) &&
    (!state.q || r.n.toLowerCase().indexOf(state.q) > -1 || r.id.replace('#', '').indexOf(state.q.replace('#', '')) > -1));
  if (!rows.length) { $('#list').innerHTML = '<p class="mut">ไม่พบคิว</p>'; return; }
  $('#list').innerHTML = rows.map(r => `
    <div class="row" data-tab="${esc(r.tab)}" data-row="${r.row}" data-id="${esc(r.id)}">
      <div class="rh"><b>${esc(r.id || '—')}</b><span>${esc(r.n)}</span><small>${esc(r.tab)} · อัปเดต ${esc(r.d)}</small></div>
      <div class="grid">
        <label>ชื่อ<input class="f-n" value="${esc(r.n)}"></label>
        <label>สถานะ<select class="f-s">${statusOpts(r.s)}</select></label>
        <label>คิว<input class="f-q" value="${esc(r.q)}"></label>
        <label>ทั้งหมด<input class="f-t" type="number" min="0" value="${r.tot}"></label>
        <label>เสร็จ<input class="f-d" type="number" min="0" value="${r.done}"></label>
      </div>
      <div class="acts">
        <button class="pri" data-a="save">บันทึก</button>
        <button data-a="daily">อัปเดตรายวัน</button>
        <button data-a="card">การ์ด</button>
        <button class="dan" data-a="del">ลบ</button>
      </div>
    </div>`).join('');
}

$('#list').onclick = async e => {
  const b = e.target.closest('button[data-a]'); if (!b) return;
  const el = b.closest('.row');
  const base = { tab: el.dataset.tab, row: Number(el.dataset.row), id: el.dataset.id };
  const get = c => el.querySelector(c).value;
  if (b.dataset.a === 'card') {
    openCard({ tab: base.tab, id: base.id, n: get('.f-n'), tot: get('.f-t') });
  } else if (b.dataset.a === 'daily') {
    const rr = state.rows.find(x => x.tab === base.tab && x.row === base.row && x.id === base.id);
    if (rr) openDaily(rr); else toast('ไม่พบข้อมูล กดรีเฟรชก่อน');
  } else if (b.dataset.a === 'save') {
    b.disabled = true;
    const r = await call('admin_update', Object.assign({ n: get('.f-n'), s: get('.f-s'), q: get('.f-q'), tot: get('.f-t'), done: get('.f-d') }, base));
    b.disabled = false;
    toast(r.ok ? 'บันทึกแล้ว' : (r.msg || 'บันทึกไม่ได้'));
    if (r.ok) load();
  } else if (b.dataset.a === 'del') {
    if (!confirm('ลบคิว ' + (base.id || '') + ' ' + get('.f-n') + ' ?')) return;
    const r = await call('admin_delete', base);
    toast(r.ok ? 'ลบแล้ว' : (r.msg || 'ลบไม่ได้'));
    load();
  }
};

async function renderCanvas(html) {
  if (typeof html2canvas === 'undefined') throw new Error('โหลดตัวสร้างรูปไม่ได้ (ต้องต่ออินเทอร์เน็ต)');
  if (document.fonts && document.fonts.ready) await document.fonts.ready;
  const host = document.createElement('div');
  host.style.cssText = 'position:fixed;left:-10000px;top:0';
  host.innerHTML = html;
  document.body.appendChild(host);
  try { return await html2canvas(host.firstElementChild, { scale: 2, backgroundColor: null, useCORS: true }); }
  finally { host.remove(); }
}

// ====== การ์ดอัปเดตรายวัน ======
const DAILY = { tab: '', row: 0, id: '', tot: 0, baseDone: 0, hist: [], saved: false };
const thDate = (day, short) => {
  const d = new Date(day + 'T00:00:00');
  if (isNaN(d)) return day;
  return d.toLocaleDateString('th-TH', short ? { day: 'numeric', month: 'short' } : { day: 'numeric', month: 'short', year: 'numeric' });
};
const todayKey = () => new Date().toLocaleDateString('sv-SE');
const sgn = n => (n >= 0 ? '+' : '-') + fmt(Math.abs(n));

function mergeHist(hist, day, gain) {
  const m = {};
  hist.forEach(x => { m[x.day] = (m[x.day] || 0) + x.gain; });
  if (gain) m[day] = (m[day] || 0) + gain;
  return Object.keys(m).sort().reverse().map(k => ({ day: k, gain: m[k] }));
}

function dailyVals() {
  const gain = Number($('#dGain').value) || 0, day = $('#dDay').value || todayKey();
  const cum = DAILY.saved ? DAILY.baseDone : DAILY.baseDone + gain;
  const hist = DAILY.saved ? DAILY.hist : mergeHist(DAILY.hist, day, gain);
  return {
    name: $('#dName').value || '-', code: DAILY.id || '#----', job: DAILY.tab, gain, day,
    cum: Math.max(0, cum), tot: DAILY.tot, hist: hist.slice(0, 4),
    unit: CONFIG.UNIT_SHORT[DAILY.tab] || '', label: CONFIG.DAILY_LABEL[DAILY.tab] || 'วันนี้ทำได้'
  };
}

    : '<span class="mutl">ยังไม่มีประวัติ</span>';
  return `<div class="card daily t-${THEME}">
    <div class="sheen"></div>

    <div class="ring" style="width:420px;height:420px;right:-120px;top:-150px"></div>

    <div class="prow"><span class="lbx">สะสมทั้งหมด</span><span class="pval">${fmt(v.cum)} / ${fmt(v.tot)}</span></div>
    <div class="bar"><i style="width:${pct > 0 ? Math.max(pct, 2) : 0}%"></i></div>
    <div class="psub"><span>คืบหน้า ${pct}%</span><span>คงเหลือ ${fmt(remain)} ${esc(v.unit)}</span></div>

(function () {

  const ctx = cv.getContext('2d');
  const still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W = 0, H = 0, cols = [];
  function mk(x) {
    const len = 6 + Math.floor(Math.random() * 12), s = [];
    for (let i = 0; i < len; i++) s.push(Math.random() < .5 ? '0' : '1');
    return { x, y: Math.random() * H - len * 22, v: .35 + Math.random() * .9, s, c: Math.random() < .5 ? '91,140,255' : '255,95,168', a: .14 + Math.random() * .3 };
  }
  function init() {
    W = cv.width = innerWidth; H = cv.height = innerHeight;
    const n = Math.max(8, Math.floor(W / 70)); cols = [];
    for (let i = 0; i < n; i++) cols.push(mk(i * (W / n) + Math.random() * (W / n) * .6));
  }
  function frame() {
    ctx.clearRect(0, 0, W, H);
    ctx.font = '700 16px monospace'; ctx.textAlign = 'center';
    cols.forEach(c => {
      for (let i = 0; i < c.s.length; i++) {
        const y = c.y + i * 22;
        if (y < -22 || y > H + 22) continue;
        ctx.fillStyle = 'rgba(' + c.c + ',' + (c.a * (i + 1) / c.s.length).toFixed(3) + ')';
        ctx.fillText(c.s[i], c.x, y);
      }
      if (!still) {
        c.y += c.v;
        if (Math.random() < .02) c.s[Math.floor(Math.random() * c.s.length)] = Math.random() < .5 ? '0' : '1';
        if (c.y > H + 20) { const nn = mk(Math.random() * W); nn.y = -nn.s.length * 22; Object.assign(c, nn); }
      }
    });
    if (!still) requestAnimationFrame(frame);
  }
  init(); frame();
  addEventListener('resize', () => { init(); if (still) frame(); });
})();
</script>
</body>
</html>
